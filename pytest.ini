[pytest]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
testpaths = testcases
# --reruns: 栅格拖拽/选中偶发失败时，用例级自动重跑（只对崩溃/超时/我们抛的重试异常）
addopts = --alluredir=./allure-results -v --timeout=120 --reruns 2 --reruns-delay 3 --only-rerun "TimeoutError" --only-rerun "拖拽.*失败" --only-rerun "Error"
